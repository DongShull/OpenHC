# =============================================================================
# 发版点火通道（支持 X.Y.Z = 大版本.正式版.测试预发布版）
#
# 用法：
#   git push origin HEAD:release-kick/v0.4.0   # 触发发布正式版 0.4.0（Z=0，Latest 绿标）
#   git push origin HEAD:release-kick/v0.3.5   # 触发发布指定测试预发布版 0.3.5（Z>0，Pre-release）
# 触发后自动清理一次性点火分支。
# =============================================================================
name: 发版点火

on:
  push:
    branches:
      - "release-kick/v*"

permissions:
  contents: write
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验三段式版本号并触发发版流水线
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#release-kick/}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::点火分支名不合法：$TAG（须为 release-kick/v大版本.正式版.测试预发布版，如 release-kick/v0.4.0）"
            exit 1
          fi
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f release_tag="$TAG" -f target_sha="$GITHUB_SHA"

      - name: 清理一次性点火分支
        if: always()
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" \
            && echo "已清理点火分支 $GITHUB_REF_NAME" \
            || echo "::warning::点火分支清理失败：$GITHUB_REF_NAME"
