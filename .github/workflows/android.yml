# =============================================================================
# 构建、全量测试与三段式版本号（X.Y.Z = 大版本.正式版.测试预发布版）全自动发版流水线
#
# 版本号规则：
#   - X.Y.0（第 3 位为 0，如 0.3.0、0.4.0、1.0.0）→ 正式版（GitHub Latest 绿标）
#   - X.Y.Z（第 3 位 >= 1，如 0.3.1、0.3.2、0.3.3）→ 测试预发布版（Pre-release 橙标）
#
# 全自动工作方式：
#   1. 日常推分支（main / feat/*）：自动扫描已有标签推算下一个测试预发布号（如 0.3.1 → 0.3.2），
#      自动将该版本号与 versionCode 编译进 APK，截取提交说明，两段式原子发布 Pre-release！
#   2. 发正式版（如 0.4.0）：只需把 app/build.gradle.kts 的 versionName 改为 "0.4.0" 后推送
#      （或推送 release-kick/v0.4.0 点火分支 / 手动填 v0.4.0），自动汇总整个周期全部提交并发正式版！
# =============================================================================
name: 构建与测试

concurrency:
  group: build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches-ignore:
      - "release-kick/**"
    tags:
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：指定发版号（如 v0.4.0 发正式版、v0.3.5 发指定测试版；留空则自动递增第 3 位测试预发布版）"
        required: false
        default: ""
      target_sha:
        description: "可选：指定要构建发布的提交 SHA（供 release-kick 点火通道传入，留空取当前分支 HEAD）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: 同步远端全部版本标签
        run: git fetch --tags --force

      - name: 拒绝提交凭据（见 SECURITY.md）
        run: python3 tools/check_public_tree.py

      - name: 推算三段式版本号（大版本.正式版.测试预发布版）
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OVERRIDE: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # 若由推送已有 Release 的 tag 触发且该 Release 已转正公开，直接跳过避免重复发版
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "$TAG_OVERRIDE" ]; then
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
              if [ "$IS_DRAFT" = "false" ]; then
                echo "Release $GITHUB_REF_NAME 已发布，无需重复发版"
                echo "skip_publish=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
          python3 tools/generate_release_notes.py \
            --mode resolve \
            --tag-override "$TAG_OVERRIDE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 注入连接参数与签名凭据（最小权限隔离）
        env:
          IDENTITY_JSON: ${{ secrets.OPENHC_IDENTITY_JSON }}
          KEYSTORE_B64: ${{ secrets.OPENHC_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.OPENHC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$IDENTITY_JSON" ]; then
            ID_DIR="$RUNNER_TEMP/openhc-identity"
            mkdir -p "$ID_DIR"
            printf '%s' "$IDENTITY_JSON" > "$ID_DIR/openhc-identity.json"
            echo "OPENHC_IDENTITY_DIR=$ID_DIR" >> "$GITHUB_ENV"
            echo "HAS_SECRETS=true" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            SIGN_DIR="$RUNNER_TEMP/openhc-signing"
            mkdir -p "$SIGN_DIR"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$SIGN_DIR/release.p12"
            printf 'storeFile=%s/release.p12\nstorePassword=%s\nkeyAlias=openhc\nkeyPassword=%s\n' \
              "$SIGN_DIR" "$KEY_PASSWORD" "$KEY_PASSWORD" > "$SIGN_DIR/signing.properties"
            echo "OPENHC_SIGNING=$SIGN_DIR/signing.properties" >> "$GITHUB_ENV"
          fi

      - name: 运行全部检查并构建安装包（编译目标版本号进 APK）
        env:
          VER_NAME: ${{ steps.ver.outputs.version_name }}
          VER_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          ./gradlew --console=plain \
            "-Popenhc.versionName=$VER_NAME" \
            "-Popenhc.versionCode=$VER_CODE" \
            check assembleRelease assembleDebug

      - name: 清理临时签名与连接凭据
        if: always()
        run: rm -rf "$RUNNER_TEMP/openhc-identity" "$RUNNER_TEMP/openhc-signing"

      - name: 守门校验 APK 完整性并自动截取提交记录生成更新说明
        env:
          VER_NAME: ${{ steps.ver.outputs.version_name }}
          VER_CODE: ${{ steps.ver.outputs.version_code }}
          REL_NAME: ${{ steps.ver.outputs.release_apk_name }}
          DBG_NAME: ${{ steps.ver.outputs.debug_apk_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$REL_APK" "dist/$REL_NAME"
          cp "$DBG_APK" "dist/$DBG_NAME"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          CERT_FLAG=""
          if [ "${HAS_SECRETS:-}" = "true" ]; then
            CERT_FLAG="--require-release-cert"
          fi
          python3 tools/verify_release_apk.py \
            --dist-dir dist \
            --release-apk "dist/$REL_NAME" \
            --aapt2 "$BUILD_TOOLS/aapt2" \
            --apksigner "$BUILD_TOOLS/apksigner" \
            --expected-version "$VER_NAME" \
            --expected-code "$VER_CODE" \
            $CERT_FLAG

          python3 tools/generate_release_notes.py \
            --mode notes \
            --version "$VER_NAME" \
            --out-notes dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Actions 构建产物备份
        uses: actions/upload-artifact@v4
        with:
          name: OpenHC-${{ steps.ver.outputs.version_name }}-apk
          path: |
            dist/*.apk
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: 两段式原子发布直链 APK 与更新说明到 Releases
        if: github.event_name != 'pull_request' && steps.ver.outputs.skip_publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.release_tag }}
          TITLE: ${{ steps.ver.outputs.release_title }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          REL_NAME: ${{ steps.ver.outputs.release_apk_name }}
          DBG_NAME: ${{ steps.ver.outputs.debug_apk_name }}
        run: |
          set -euo pipefail
          CREATE_PRE_FLAG=""
          PUBLISH_FLAG="--latest"
          if [ "$PRERELEASE" = "true" ]; then
            CREATE_PRE_FLAG="--prerelease"
            PUBLISH_FLAG="--prerelease"
          fi

          TARGET_COMMIT=$(git rev-parse HEAD)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_COMMIT" --draft \
              --title "$TITLE" --notes-file dist/release-notes.md $CREATE_PRE_FLAG
          else
            IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_COMMIT"
            fi
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/$REL_NAME" "dist/$DBG_NAME" dist/checksums.txt

          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for req in "$REL_NAME" "$DBG_NAME" "checksums.txt"; do
            echo "$ASSETS" | grep -qx "$req" || { echo "::error::缺少附件 $req，拒绝转正"; exit 1; }
          done

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file dist/release-notes.md --draft=false $PUBLISH_FLAG

          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          printf '\n---\n🚀 **已发布 %s**：%s\n' "$TITLE" "$URL" >> "$GITHUB_STEP_SUMMARY"
