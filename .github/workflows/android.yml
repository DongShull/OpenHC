name: 构建与测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拒绝提交凭据（见 SECURITY.md）
        run: python3 tools/check_public_tree.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 注入连接参数与签名凭据（若已配置仓库 Secrets）
        env:
          IDENTITY_JSON: ${{ secrets.OPENHC_IDENTITY_JSON }}
          KEYSTORE_B64: ${{ secrets.OPENHC_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.OPENHC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$IDENTITY_JSON" ]; then
            ID_DIR="$RUNNER_TEMP/openhc-identity"
            mkdir -p "$ID_DIR"
            printf '%s' "$IDENTITY_JSON" > "$ID_DIR/openhc-identity.json"
            echo "OPENHC_IDENTITY_DIR=$ID_DIR" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            SIGN_DIR="$RUNNER_TEMP/openhc-signing"
            mkdir -p "$SIGN_DIR"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$SIGN_DIR/release.p12"
            printf 'storeFile=%s/release.p12\nstorePassword=%s\nkeyAlias=openhc\nkeyPassword=%s\n' \
              "$SIGN_DIR" "$KEY_PASSWORD" "$KEY_PASSWORD" > "$SIGN_DIR/signing.properties"
            echo "OPENHC_SIGNING=$SIGN_DIR/signing.properties" >> "$GITHUB_ENV"
          fi

      - name: 运行全部检查并构建安装包（Release + Debug）
        run: ./gradlew --console=plain check assembleRelease assembleDebug

      - name: 整理输出 APK
        run: |
          mkdir -p dist
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$REL_APK" "dist/OpenHC-0.3.0-car-opt-release.apk"
          cp "$DBG_APK" "dist/OpenHC-0.3.0-car-opt-debug.apk"
          ls -lh dist/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenHC-car-opt-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布直链 APK 到 Releases（免解压直接下载 .apk）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="car-opt-latest"
          TITLE="OpenHC 0.3.0 车机增强版（最新自动构建）"
          NOTES=$(printf '分支：`%s` | 提交：`%s`\n\n直接点击下方 **Assets** 里的 `.apk` 文件即可下载安装（无需解压 `.zip`）：\n- **推荐安装**：`OpenHC-0.3.0-car-opt-release.apk`（R8 瘦身签名版，内置连接参数 + 全链路优化 + 诊断页实时滚动日志）\n- **调试备用**：`OpenHC-0.3.0-car-opt-debug.apk`\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" dist/*.apk --title "$TITLE" --notes "$NOTES" --prerelease
          fi
